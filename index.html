<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sample Book">
<title>Sample Book</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#fff; --ink:#1b2230; --mute:#6b7280; --faint:#9aa3af; --line:#e2e5ea; --line2:#d3d8df;
  --acc:#1f3a5f; --acc2:#2c5687; --accbg:#eaf0f7; --red:#c0392b; --redbg:#fdeceb; --green:#1e7b4a; --greenbg:#e6f4ec; --amber:#9a5b00; --amberbg:#fdf1dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:6px;padding:5px 11px;height:30px;white-space:nowrap}
button:hover{border-color:var(--acc2)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{background:var(--acc2)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--accbg)}
button.danger{color:var(--red)}
button.danger:hover{border-color:var(--red)}
button.sm{height:24px;padding:0 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
kbd{font:11px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.18);border-radius:3px;padding:1px 4px;margin-left:4px}
input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line2);border-radius:6px;background:#fff;padding:0 8px;height:30px;width:100%;min-width:0}
textarea{height:auto;min-height:54px;padding:6px 8px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;height:auto}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(44,86,135,.16)}
input::placeholder,textarea::placeholder{color:var(--faint);font-style:italic}
.miss{border-color:#e3928a!important;background:var(--redbg)!important}
.warn{border-color:#e5b45c!important;background:var(--amberbg)!important}

header.top{height:52px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px}
header.top .brand{display:flex;align-items:center;gap:8px;min-width:190px}
header.top .brand input{background:transparent;border-color:transparent;color:#fff;font-weight:600;font-size:15px;width:170px;padding:0 4px}
header.top .brand input:hover{border-color:rgba(255,255,255,.3)}
header.top .brand input:focus{background:rgba(255,255,255,.1);box-shadow:none}
header.top .search{flex:1;max-width:380px}
header.top .search input{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
header.top .search input::placeholder{color:rgba(255,255,255,.6)}
header.top .search input:focus{background:#fff;color:var(--ink)}
header.top .actions{display:flex;gap:6px;margin-left:auto;align-items:center}
header.top .actions button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
header.top .actions button:hover{background:rgba(255,255,255,.2)}
header.top .actions button.primary{background:#fff;color:var(--acc);border-color:#fff;font-weight:600}
header.top .actions button.primary kbd{background:var(--accbg)}
.pill{font-size:11.5px;border-radius:20px;padding:3px 9px;background:rgba(255,255,255,.12);cursor:pointer;white-space:nowrap}
.pill.warn{background:#f6c26b!important;color:#4a3000;border:none!important}
.saved{font-size:11.5px;opacity:.75;min-width:56px;text-align:right}

.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 52px)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidehead{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sidehead .row{display:flex;gap:6px;align-items:center}
.sidehead label.chk{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12.5px;cursor:pointer}
.stats{font-size:12px;color:var(--mute)}
.stats b{color:var(--ink)}
.bulk{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--accbg);border-radius:8px;padding:6px 8px;font-size:12px}
.bulk b{margin-right:4px}
#list{overflow:auto;flex:1;padding:0 0 30px}
.grp{position:sticky;top:0;background:#f8f9fb;border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:4px 8px 4px 12px;font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;z-index:1}
.grp .sp{flex:1}
.grp button{height:22px;padding:0 7px;font-size:11.5px;text-transform:none;letter-spacing:0}
.item{display:grid;grid-template-columns:18px 44px 1fr auto;gap:8px;align-items:center;padding:6px 12px 6px 6px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:#f6f8fb}
.item.on{background:var(--accbg);border-left-color:var(--acc)}
.item .sel{opacity:0}
.item:hover .sel,.item .sel:checked,body.selmode .item .sel{opacity:1}
.item .th{width:44px;height:44px;border-radius:6px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .kod{font-weight:600;font-size:13.5px}
.item .cols{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.item.dropped{opacity:.5}
.item.dropped .kod{text-decoration:line-through}
.badge{font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px;white-space:nowrap}
.badge.r{background:var(--redbg);color:var(--red)}
.badge.g{background:var(--greenbg);color:var(--green)}
.badge.a{background:var(--amberbg);color:var(--amber)}
.badge.x{background:#eceef1;color:var(--mute)}

main{overflow:auto;padding:16px 20px 60px;min-width:0}
.empty{max-width:640px;margin:60px auto;text-align:center;color:var(--mute)}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 8px}
.empty .btns{display:flex;gap:10px;justify-content:center;margin:20px 0}
.empty ul{text-align:left;line-height:1.8;font-size:13px}

.edhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:10px}
.edhead .crumb{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.edhead h1{margin:0;font-size:24px;line-height:1.2;display:flex;align-items:center;gap:10px}
.edhead .sp{flex:1}
.edhead .acts{display:flex;gap:6px}
.dropbar{background:#eceef1;color:var(--mute);border-radius:8px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.missbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;padding:8px 10px;border-radius:8px;background:var(--redbg);color:var(--red);font-size:12.5px}
.missbar.ok{background:var(--greenbg);color:var(--green)}
.missbar.am{background:var(--amberbg);color:var(--amber)}
.missbar a{color:inherit;text-decoration:underline;cursor:pointer}
.missbar .chip{background:#fff;border:1px solid currentColor;border-radius:12px;padding:1px 8px;cursor:pointer;opacity:.9}
.missbar .chip:hover{opacity:1}
.missbar .chip b{font-weight:600}

.grid2{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
@media (max-width:1150px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--accbg);color:var(--acc);border-radius:10px;padding:0 7px;font-size:11px}
.card h2 .sp{flex:1}
.card h2 button{text-transform:none;letter-spacing:0}
.fgrp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;margin-bottom:12px}
.fgrp:last-child{margin-bottom:0}
.fgrp .t{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--acc2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-top:2px;display:flex;gap:8px;align-items:center}
.fgrp .t .sp{flex:1}
.fgrp .t button{height:20px;padding:0 6px;font-size:11px;text-transform:none;letter-spacing:0;font-weight:400}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f>span i{color:var(--red);font-style:normal}
.f.wide{grid-column:span 2}
.f.full{grid-column:1/-1}
.f input.big{font-size:15px;font-weight:600}
.wi{display:flex;gap:6px;align-items:center}
.wi img{width:30px;height:30px;border-radius:5px;object-fit:cover;flex:none;cursor:zoom-in;border:1px solid var(--line)}
.wi img:not([src]){display:none}

/* accessory chips */
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:30px;border:1px solid var(--line2);border-radius:6px;padding:2px 4px;background:#fff}
.chips:focus-within{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(44,86,135,.16)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accbg);border-radius:14px;padding:1px 4px 1px 2px;font-size:12px;max-width:100%}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;cursor:zoom-in;background:#ddd}
.chip.noimg{padding-left:8px}
.chip.none{background:#eceef1;color:var(--mute);padding-left:8px}
.chip.warn{border:1px solid #e5b45c}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{height:18px;width:18px;padding:0;border:none;background:transparent;color:var(--mute);border-radius:50%;font-size:12px;line-height:1}
.chip button:hover{background:rgba(0,0,0,.08);color:var(--red)}
.chips input{border:none;height:24px;flex:1;min-width:40px;padding:0 4px;box-shadow:none!important;background:transparent}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eef0f3;cursor:zoom-in;border:2px solid transparent}
.ph.main{border-color:var(--acc)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:4px;top:4px;background:var(--acc);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
.ph .tools{position:absolute;right:4px;top:4px;display:none;gap:3px}
.ph:hover .tools{display:flex}
.ph .tools button{height:24px;padding:0 6px;font-size:12px;background:rgba(255,255,255,.92)}
.addph{aspect-ratio:1;border:2px dashed var(--line2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:11.5px;cursor:pointer;padding:6px;gap:4px}
.addph b{font-size:22px;color:var(--acc2);font-weight:400}
.addph:hover{border-color:var(--acc2);background:var(--accbg)}
.photos.big{grid-template-columns:1fr 1fr}
.photos.big .ph:first-child{grid-column:1/-1}
.inbox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.inbox .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}
.inbox .h b{color:var(--ink)}
.inbox .h .sp{flex:1}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:260px;overflow:auto}
.strip .ph{cursor:pointer}
.strip .ph:hover{border-color:var(--green)}
.strip .ph .add{position:absolute;inset:auto 0 0 0;background:rgba(30,123,74,.88);color:#fff;font-size:10.5px;text-align:center;padding:2px;display:none}
.strip .ph:hover .add{display:block}

table.vt{width:100%;border-collapse:separate;border-spacing:0}
table.vt th{font-size:11px;font-weight:600;color:var(--mute);text-align:left;padding:0 4px 5px;white-space:nowrap}
table.vt th i{color:var(--red);font-style:normal}
table.vt th small{font-weight:400;color:var(--faint)}
table.vt td{padding:3px 4px;vertical-align:top}
table.vt td.no{color:var(--faint);font-size:12px;padding-top:9px;width:22px;text-align:right}
table.vt td.act{white-space:nowrap;width:64px}
table.vt td.act button{height:30px;padding:0 7px}
table.vt input.colr{font-weight:600}
.vadd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.qc{height:26px;padding:0 9px;font-size:12px;border-radius:13px;background:var(--accbg);border-color:transparent;color:var(--acc)}
.hint{font-size:11.5px;color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0}

.dd{position:fixed;z-index:65;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(20,30,50,.18);max-height:340px;overflow:auto;display:none;padding:4px;min-width:220px}
.dd.on{display:block}
.dd .o{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer}
.dd .o.on,.dd .o:hover{background:var(--accbg)}
.dd .o img{width:36px;height:36px;object-fit:cover;border-radius:5px;background:#eee;flex:none}
.dd .o .ni{width:36px;height:36px;border-radius:5px;background:#f1f3f6;flex:none}
.dd .o .v{flex:1;min-width:0}
.dd .o .v div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd .o .s{font-size:11px;color:var(--mute)}
.dd .o .c{font-size:11px;color:var(--faint)}
.dd .o .star{font-size:10px;color:var(--green);background:var(--greenbg);border-radius:8px;padding:0 5px}
.dd .o.add{color:var(--acc2);font-weight:600;border-top:1px solid var(--line);margin-top:2px}
.dd .o.none{color:var(--mute)}
.dd .sec{font-size:10.5px;text-transform:uppercase;color:var(--faint);padding:6px 8px 2px;letter-spacing:.4px}

#modal{display:none}
#modal.on{display:block}
.mb{position:fixed;inset:0;background:rgba(15,23,40,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.mw{background:#fff;border-radius:12px;width:540px;max-width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mw.wide{width:860px}
.mw.xwide{width:1180px;padding:0;overflow:hidden}
.mw h3{margin:0 0 12px;font-size:17px}
.mw p{margin:6px 0 12px;color:#374151}
.mw .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mw label.opt{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.lt{width:100%;border-collapse:collapse}
.lt td,.lt th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-size:12.5px;vertical-align:middle}
.lt th{color:var(--mute);font-weight:600;font-size:11.5px;position:sticky;top:0;background:#fff;z-index:1}
.reqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.sum{background:var(--accbg);border-radius:8px;padding:10px 12px;margin:10px 0;line-height:1.7}

/* library */
.lib{display:grid;grid-template-columns:230px 1fr;height:84vh}
.lib nav{background:#f6f7f9;border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
.lib nav .h{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;padding:10px 8px 4px}
.lib nav a{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.lib nav a:hover{background:#eceff3}
.lib nav a.on{background:var(--acc);color:#fff}
.lib nav a span{opacity:.6;font-size:11.5px}
.lib nav .newcat{margin:8px;width:calc(100% - 16px)}
.lib section{display:flex;flex-direction:column;min-height:0}
.lib .lh{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.lib .lh .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lib .lh h3{margin:0;font-size:17px}
.lib .lh input.lname{font-size:17px;font-weight:600;width:260px}
.lib .lh label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;white-space:nowrap}
.lib .lh .sp{flex:1}
.lib .lb{flex:1;overflow:auto;padding:0 18px 18px}
.lib .lf{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.tile{width:48px;height:48px;border-radius:6px;background:#f1f3f6;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--faint);font-size:10px;text-align:center;line-height:1.1;flex:none}
.tile img{width:100%;height:100%;object-fit:cover}
.tile:hover{border-color:var(--acc2)}
.tile.has{border-style:solid;border-color:var(--line)}
.tile.lg{width:64px;height:64px}
.cc-area{background:#f8f9fb;border-radius:8px;padding:10px;margin:4px 0 8px}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cct{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px}
.cct input{height:28px;font-size:12px}
.cct button{height:24px;width:24px;padding:0;flex:none}
.used{font-size:11.5px;color:var(--mute)}
.used.zero{color:var(--faint)}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw}
#toast.on{opacity:1}
#toast.err{background:var(--red)}
#dropov{position:fixed;inset:0;z-index:70;display:none;grid-template-columns:1fr 1fr;gap:16px;padding:40px;background:rgba(15,23,40,.55)}
#dropov.on{display:grid}
#dropov div{border:3px dashed rgba(255,255,255,.7);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:600;text-align:center;gap:6px}
#dropov div small{font-weight:400;font-size:13px;opacity:.85}
#dropov div.hov{background:rgba(255,255,255,.15);border-color:#fff}
#dropov div.dis{opacity:.35}
#lb{position:fixed;inset:0;background:rgba(10,14,22,.92);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:86vh;border-radius:6px}
#lb .cap{color:#fff;font-size:14px}
#lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:13px;opacity:.8}
@media (hover:none){.ph .tools{display:flex}.item .sel{opacity:1}kbd{display:none}.strip .ph .add{display:block}}
@media (max-width:1000px){.layout{grid-template-columns:260px 1fr}header.top .search{display:none}header.top .brand{min-width:0}header.top .brand input{width:120px}.fgrp{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px 12px 60px}}
header.top{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}.layout{height:calc(100vh - 52px - env(safe-area-inset-top))}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:95;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--acc)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>📒</b><input id="projName" title="Project name (used in the Excel file name)"></div>
  <div class="search"><input id="q" placeholder="Search: code, color, card, notes…  (Ctrl+F)"></div>
  <div class="actions">
    <span class="saved" id="saved"></span>
    <span class="pill" id="bkpill" title="Backup / restore"></span>
    <button class="primary" id="btnNew" title="New model, pre-filled from the current one">+ New model <kbd>Alt+N</kbd></button>
    <button id="btnLib">Libraries</button>
    <button id="btnImport">Import Excel</button>
    <button id="btnExport">Export Excel</button>
    <button id="btnSettings" title="Settings">⚙</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="sidehead">
      <div class="row"><select id="fSup"></select><select id="fStat" style="width:118px"><option value="">All</option><option value="active">Active</option><option value="dropped">Dropped</option></select></div>
      <div class="row"><label class="chk"><input type="checkbox" id="fMiss"> Incomplete only</label><span style="flex:1"></span><button class="sm" id="bSelAll" title="Select all models in the list">Select</button></div>
      <div id="bulk"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="list"></div>

<script>
"use strict";
/* ============================== Fields ============================== */
// lv: m = whole model, v = per color, b = model default that a color may override
// t: text | list | cc (color code of a color card) | acc (accessory multi-pick) | num
const BASE = [
  {k:'supplier',     l:'Supplier',        x:'Supplier Name',  lv:'m', t:'list', list:'supplier'},
  {k:'group',        l:'Group',           x:'Group',          lv:'m', t:'text'},
  {k:'code',         l:'Model code',      x:'Code',           lv:'m', t:'text'},
  {k:'color',        l:'Color',           x:'Color',          lv:'v', t:'list', list:'color'},
  {k:'mainMaterial', l:'Main material',   x:'Main Material',  lv:'m', t:'list', list:'mainMaterial'},
  {k:'modelType',    l:'Model type',      x:'Model Type',     lv:'m', t:'list', list:'modelType'},
  {k:'material1',    l:'Material 1',      x:'Material 1',     lv:'m', t:'list', list:'material'},
  {k:'card1',        l:'Color card 1',    x:'Color Card 1',   lv:'m', t:'list', list:'card'},
  {k:'cardColor1',   l:'Color code 1',    x:'Color Code 1',   lv:'v', t:'cc',   of:'card1'},
  {k:'material2',    l:'Material 2',      x:'Material 2',     lv:'m', t:'list', list:'material'},
  {k:'card2',        l:'Color card 2',    x:'Color Card 2',   lv:'b', t:'list', list:'card'},
  {k:'cardColor2',   l:'Color code 2',    x:'Color Code 2',   lv:'v', t:'cc',   of:'card2'},
  {k:'liningMaterial',l:'Lining material',x:'Lining Material',lv:'m', t:'list', list:'lining'},
  {k:'liningColor',  l:'Lining color',    x:'Lining Color',   lv:'b', t:'text'},
  {k:'finish',       l:'Hardware color',  x:'Logo & Buckle Colors', lv:'b', t:'list', list:'finish'},
  {k:'notes',        l:'Notes',           x:'Notes',          lv:'b', t:'text'},
  {k:'height',       l:'Height',          x:'Height (cm)',    lv:'m', t:'num'},
  {k:'width',        l:'Width',           x:'Width (cm)',     lv:'m', t:'num'},
  {k:'depth',        l:'Depth',           x:'Depth (cm)',     lv:'m', t:'num'},
];
const VCOLS = ['color','cardColor1','card2','cardColor2','liningColor','finish','notes'];
const DEFAULT_REQ = {supplier:1,group:1,code:1,color:1,mainMaterial:1,modelType:1,material1:1,card1:1,cardColor1:1,finish:1,height:1,width:1,depth:1,photo:1,cc2cond:1};
const LIST_FIELDS = id=>allFields().filter(f=>f.list===id);
function catList(){return S.catOrder.map(id=>S.lists[id]).filter(Boolean)}
function accFields(onlyExcel){return catList().filter(c=>!onlyExcel||c.excel!==false).map(c=>({k:c.id,l:c.name,x:c.name,lv:'m',t:'acc',list:c.id,cat:c}))}
function allFields(onlyExcel){const i=BASE.findIndex(f=>f.k==='finish');return[...BASE.slice(0,i),...accFields(onlyExcel),...BASE.slice(i)]}
function fd(k){return BASE.find(f=>f.k===k)||(S.lists[k]&&S.lists[k].kind==='acc'?{k,l:S.lists[k].name,x:S.lists[k].name,lv:'m',t:'acc',list:k,cat:S.lists[k]}:null)}
const isReq=k=>{const f=fd(k);if(f&&f.t==='acc')return!!f.cat.req;return!!S.settings.req[k]};

/* ============================== Helpers ============================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
const fold=s=>clean(s).toLocaleLowerCase('tr').replace(/i̇/g,'i').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const natcmp=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true,sensitivity:'base'});
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('numune-defteri',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('img')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  get(s,k){return this.tx(s,'readonly',o=>o.get(k))},put(s,k,v){return this.tx(s,'readwrite',o=>o.put(v,k))},del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},clear(s){return this.tx(s,'readwrite',o=>o.clear())}};

const urlCache=new Map();
async function imgURL(id,kind='thumb'){if(!id)return'';const key=id+'|'+kind;if(urlCache.has(key))return urlCache.get(key);const r=await DB.get('img',id);if(!r)return'';const u=URL.createObjectURL(r[kind]||r.full);urlCache.set(key,u);return u}
function hydrate(root=document){$$('img[data-img]',root).forEach(async im=>{if(im.dataset.done===im.dataset.img)return;im.dataset.done=im.dataset.img;const u=await imgURL(im.dataset.img,im.dataset.kind||'thumb');if(u)im.src=u;else im.removeAttribute('src')})}
function scaleTo(bmp,max,q){const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),'image/jpeg',q))}
async function decode(blob){try{return await createImageBitmap(blob,{imageOrientation:'from-image'})}catch(e){try{return await createImageBitmap(blob)}catch(e2){return null}}}
async function ingest(blob,name='',t=Date.now()){
  const bmp=await decode(blob);
  if(!bmp){const heic=/\.hei[cf]$/i.test(name)||/hei[cf]/i.test(blob.type);throw new Error(heic?'HEIC photo cannot be opened (iPhone: Settings › Camera › Formats › "Most Compatible", or send as JPG)':'Cannot open image: '+name)}
  const full=await scaleTo(bmp,1600,.86),thumb=await scaleTo(bmp,260,.8);bmp.close&&bmp.close();
  const id=uid();await DB.put('img',id,{full:full.blob,thumb:thumb.blob,name,t});return id}
const isImg=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|hei[cf])$/i.test(f.name||'');
async function ingestFiles(files){
  const list=[...files].filter(isImg);list.sort((a,b)=>(a.lastModified||0)-(b.lastModified||0)||natcmp(a.name,b.name));
  const ids=[],errs=[];for(let i=0;i<list.length;i++){if(list.length>2)busy(true,`Processing photos ${i+1}/${list.length}…`);try{ids.push(await ingest(list[i],list[i].name,list[i].lastModified))}catch(e){errs.push(e.message)}}
  busy(false);if(errs.length)toast(errs[0]+(errs.length>1?` (+${errs.length-1})`:''),1);return ids}
async function dropImage(id){if(!id)return;await DB.del('img',id);['thumb','full'].forEach(k=>{const u=urlCache.get(id+'|'+k);if(u){URL.revokeObjectURL(u);urlCache.delete(id+'|'+k)}})}
async function addPhotosToModel(files){const m=M();if(!m)return addToInbox(files);const ids=await ingestFiles(files);if(!ids.length)return;m.photos.push(...ids);changed();renderPhotos();updateIssues();toast(ids.length+' photo(s) added')}
async function addToInbox(files){const ids=await ingestFiles(files);if(!ids.length)return;S.inbox.push(...ids);changed();renderPhotos();toast(ids.length+' photo(s) added to inbox')}

const L=id=>S.lists[id];
function findItem(listId,val){const l=L(listId);if(!l||!clean(val))return null;const f=fold(val);return l.items.find(i=>fold(i.name)===f)||l.items.find(i=>i.tr&&fold(i.tr)===f)||null}
const findCard=name=>findItem('card',name);
function findCardColor(card,code){if(!card||!clean(code))return null;const f=fold(code);return(card.colors||[]).find(c=>fold(c.code)===f)||null}
function addToList(listId,name){name=clean(name);if(!name)return null;const ex=findItem(listId,name);if(ex)return ex;const it=mkItem(name);if(L(listId).kind==='card')it.colors=[];L(listId).items.push(it);changed();return it}
function addCardColor(card,code){code=clean(code);if(!card||!code)return null;card.colors=card.colors||[];const ex=findCardColor(card,code);if(ex)return ex;const c={id:uid(),code,img:''};card.colors.push(c);changed();return c}
function usage(listId){const cnt=new Map();const inc=v=>{const k=fold(v);if(k)cnt.set(k,(cnt.get(k)||0)+1)};
  for(const m of S.models){for(const f of LIST_FIELDS(listId)){if(f.t==='acc'){for(const v of (m.acc[f.k]||[]))if(v!==NONE)inc(v)}else{if(f.lv!=='v')inc(m[f.k]);if(f.lv!=='m')for(const v of m.variants)inc(v[f.k])}}}return cnt}
function cardColorUsage(cardName){const cnt=new Map();const cf=fold(cardName);for(const m of S.models)for(const v of m.variants){if(fold(m.card1)===cf&&v.cardColor1){const k=fold(v.cardColor1);cnt.set(k,(cnt.get(k)||0)+1)}if(fold(eff(m,v,'card2'))===cf&&v.cardColor2){const k=fold(v.cardColor2);cnt.set(k,(cnt.get(k)||0)+1)}}return cnt}
function renameValue(listId,from,to){let n=0;const ff=fold(from);
  for(const m of S.models)for(const f of LIST_FIELDS(listId)){if(f.t==='acc'){const a=m.acc[f.k]||[];const b=[];for(const v of a){const nv=fold(v)===ff?to:v;if(nv!==v)n++;if(!b.some(x=>fold(x)===fold(nv)))b.push(nv)}m.acc[f.k]=b}
    else{if(f.lv!=='v'&&fold(m[f.k])===ff&&m[f.k]!==to){m[f.k]=to;n++}if(f.lv!=='m')for(const v of m.variants)if(fold(v[f.k])===ff&&v[f.k]!==to){v[f.k]=to;n++}}}
  return n}
function renameCardColor(cardName,from,to){let n=0;const cf=fold(cardName),ff=fold(from);for(const m of S.models)for(const v of m.variants){if(fold(m.card1)===cf&&fold(v.cardColor1)===ff){v.cardColor1=to;n++}if(fold(eff(m,v,'card2'))===cf&&fold(v.cardColor2)===ff){v.cardColor2=to;n++}}return n}

/* ============================== Model helpers ============================== */
const M=()=>S.models.find(m=>m.id===cur)||null;
function eff(m,v,k){const f=fd(k);if(!f)return'';if(f.t==='acc')return m.acc[k]||[];if(f.lv==='m')return m[k]||'';if(f.lv==='v')return v?v[k]||'':'';return(v&&v[k])||m[k]||''}
const accText=a=>(a||[]).map(x=>x===NONE?'None':x).join('; ');
function issues(m){
  const miss=[],warn=[];const vs=m.variants;
  for(const f of allFields()){
    const req=isReq(f.k);
    if(f.t==='acc'){const a=m.acc[f.k]||[];if(req&&!a.length)miss.push({k:f.k});if(f.cat.strict)for(const v of a)if(v!==NONE&&!findItem(f.k,v))warn.push({k:f.k,val:v});continue}
    if(f.lv==='m'){if(req&&!clean(m[f.k]))miss.push({k:f.k});if(f.t==='list'&&L(f.list).strict&&clean(m[f.k])&&!findItem(f.list,m[f.k]))warn.push({k:f.k,val:m[f.k]})}
    else if(f.lv==='b'){if(f.t==='list'&&L(f.list).strict){if(clean(m[f.k])&&!findItem(f.list,m[f.k]))warn.push({k:f.k,val:m[f.k]});for(const v of vs)if(clean(v[f.k])&&!findItem(f.list,v[f.k]))warn.push({k:f.k,vid:v.id,val:v[f.k]})}
      if(req){if(!vs.length){if(!clean(m[f.k]))miss.push({k:f.k})}else for(const v of vs)if(!clean(eff(m,v,f.k)))miss.push({k:f.k,vid:v.id})}}
    else{if(!vs.length){if(req&&f.k==='color')miss.push({k:'color',none:1})}else for(const v of vs){if(req&&!clean(v[f.k]))miss.push({k:f.k,vid:v.id});
      if(f.t==='list'&&L(f.list).strict&&clean(v[f.k])&&!findItem(f.list,v[f.k]))warn.push({k:f.k,vid:v.id,val:v[f.k]});
      if(f.t==='cc'&&clean(v[f.k])){const card=findCard(eff(m,v,f.of));if(card&&L('card').strict&&(card.colors||[]).length&&!findCardColor(card,v[f.k]))warn.push({k:f.k,vid:v.id,val:v[f.k],card:card.name})}}}
  }
  if(isReq('cc2cond')&&!isReq('cardColor2'))for(const v of vs)if(clean(eff(m,v,'card2'))&&!clean(v.cardColor2))miss.push({k:'cardColor2',vid:v.id});
  if(isReq('photo')&&!m.photos.length)miss.push({k:'photo'});
  return{miss,warn};
}
const nIssues=m=>{if(m.status==='dropped')return{miss:0,warn:0};const i=issues(m);return{miss:i.miss.length,warn:i.warn.length}};
function dupOf(m){const k=fold(m.code).replace(/[\s\-_.]/g,'');if(!k)return null;return S.models.find(o=>o!==m&&fold(o.supplier)===fold(m.supplier)&&fold(o.code).replace(/[\s\-_.]/g,'')===k)||null}
function ordered(){const so=[];for(const m of S.models)if(!so.includes(fold(m.supplier)))so.push(fold(m.supplier));const idx=new Map(S.models.map((m,i)=>[m.id,i]));return[...S.models].sort((a,b)=>so.indexOf(fold(a.supplier))-so.indexOf(fold(b.supplier))||natcmp(a.group||'~',b.group||'~')||idx.get(a.id)-idx.get(b.id))}
function matchQ(m,q){if(!q)return true;const hay=fold([...BASE.filter(f=>f.lv!=='v').map(f=>m[f.k]),...Object.values(m.acc).flat(),...m.variants.flatMap(v=>VCOLS.map(k=>v[k]))].join(' | '));return fold(q).split(' ').every(w=>hay.includes(w))}
function visible(){return ordered().filter(m=>(!F.sup||fold(m.supplier)===F.sup)&&(!F.stat||m.status===F.stat)&&(!F.miss||nIssues(m).miss)&&matchQ(m,F.q))}

function collect(k,ctx){
  const f=fd(k);const map=new Map();
  const add=(val,hit)=>{val=clean(val);if(!val)return;const key=fold(val);let e=map.get(key);if(!e){e={value:val,n:0,hit:0,sp:new Map()};map.set(key,e)}e.n++;if(hit)e.hit++;e.sp.set(val,(e.sp.get(val)||0)+1)};
  for(const m of S.models){
    if(f.lv!=='v'&&m[k])add(m[k],ctx&&ctx.sup&&fold(m.supplier)===ctx.sup);
    if(f.lv!=='m')for(const v of m.variants){if(!v[k])continue;let hit=false;
      if(f.t==='cc'&&ctx&&ctx.card)hit=fold(eff(m,v,f.of))===ctx.card;else hit=ctx&&ctx.sup&&fold(m.supplier)===ctx.sup;add(v[k],hit)}}
  for(const e of map.values()){let best=e.value,bn=-1;for(const[s,n]of e.sp)if(n>bn){best=s;bn=n}e.value=best}
  return map}
function guessCC(m,v,which){const ck=which===1?'card1':'card2',cc=which===1?'cardColor1':'cardColor2';const cardName=eff(m,v,ck);const kart=fold(cardName);const col=fold(v.color);if(!kart||!col)return'';
  const cnt=new Map();for(const o of S.models)for(const ov of o.variants){if(ov===v)continue;if(fold(eff(o,ov,ck))===kart&&fold(ov.color)===col){const val=clean(ov[cc]);if(val)cnt.set(val,(cnt.get(val)||0)+1)}}
  let best='',bn=0;for(const[s,n]of cnt)if(n>bn){best=s;bn=n}if(best)return best;
  const card=findCard(cardName);if(card){const hits=(card.colors||[]).filter(c=>fold(c.code).split(/[^a-z0-9]+/).includes(col)||fold(c.code).includes(col));if(hits.length===1)return hits[0].code}
  return''}

function renderMain(){

function updateHead(){const m=M();if(!m||!$('#h1'))return;$('#h1').textContent=m.code||'(no code)';$('#crumb').textContent=[m.supplier||'supplier?',m.group||'group?'].join(' › ')}

  $('#vN').textContent=m.variants.length;

function renderPhotos(){

async function updateThumbs(){const m=M();if(!m)return;
  for(const im of $$('#main img[data-thumbfor]')){const k=im.dataset.thumbfor;const v=im.dataset.tvid?m.variants.find(x=>x.id===im.dataset.tvid):null;let id='';
    if(k==='card1'||k==='card2'){const c=findCard(eff(m,v,k));id=c?c.img:''}else{const f=fd(k);const c=findCard(eff(m,v,f.of));const cc=findCardColor(c,v&&v[k]);id=cc?cc.img:''}
    if(id){const u=await imgURL(id);im.src=u;im.dataset.full=id}else{im.removeAttribute('src');delete im.dataset.full}}}
function updateIssues(){
  const m=M();if(!m||!$('#missbar'))return;
  const{miss,warn}=issues(m);const dr=m.status==='dropped';
  $$('#main .miss,#main .warn').forEach(e=>{if(!e.classList.contains('chip'))e.classList.remove('miss','warn')});
  const sel=x=>x.vid?`[data-k="${x.k}"][data-vid="${x.vid}"]`:`[data-k="${x.k}"]:not([data-vid])`;
  for(const x of warn){const e=$('#main '+sel(x));if(e&&!e.classList.contains('chipin'))e.classList.add('warn')}
  for(const x of miss){const e=$('#main '+sel(x));if(e){if(e.classList.contains('chipin'))e.parentNode.classList.add('miss');else e.classList.add('miss')}}
  $('#phCard')?.classList.toggle('miss',miss.some(x=>x.k==='photo'));
  const labels=[];const seen=new Set();for(const x of miss){if(seen.has(x.k))continue;seen.add(x.k);labels.push({k:x.k,vid:x.vid,l:x.k==='photo'?'Photo':x.none?'Color (none yet)':fd(x.k).l+(x.vid?' (color row)':'')})}
  const d=dupOf(m);let html='';
  if(d)html+=`<div class="missbar am">⚠ Another model at this supplier has the same code: <a data-goto="${d.id}">${esc(d.code)} (${esc(d.group||'')})</a></div>`;
  if(!dr){
    html+=labels.length?`<div class="missbar"><b>Missing:</b>${labels.map(x=>`<span class="chip" data-focus="${x.k}" ${x.vid?`data-fvid="${x.vid}"`:''}>${esc(x.l)}</span>`).join('')}</div>`:'';
    if(warn.length){const u=[];const s2=new Set();for(const w of warn){const key=w.k+'|'+fold(w.val);if(s2.has(key))continue;s2.add(key);u.push(w)}
      html+=`<div class="missbar am"><b>Not in library:</b>${u.map(w=>`<span class="chip" data-addlib="${w.k}" data-val="${esc(w.val)}" ${w.card?`data-card="${esc(w.card)}"`:''} title="Click to add to the library">${esc(w.val)} <b>+ add to ${esc(w.card?w.card:L(fd(w.k).list||w.k).name)}</b></span>`).join('')}</div>`}
    if(!labels.length&&!warn.length)html+='<div class="missbar ok">✓ This model is complete</div>'}
  $('#missbar').innerHTML=html;
}
function refreshAcc(id,focus){const el=$(`#main [data-accf="${id}"]`);if(!el)return;el.outerHTML=accHTML(L(id));hydrate($(`#main [data-accf="${id}"]`));updateIssues();if(focus){const i=$(`#main [data-accf="${id}"] .chipin`);i&&i.focus()}}

function step(d){const vis=visible();if(!vis.length)return;let i=vis.findIndex(m=>m.id===cur);i=i<0?0:Math.min(vis.length-1,Math.max(0,i+d));select(vis[i].id)}

function cmdNew(copy=S.settings.copyPrev,src=M()){
  const m=newModel();
  if(src&&copy){for(const f of BASE)if(f.lv!=='v'&&!['code','height','width','depth','notes'].includes(f.k))m[f.k]=src[f.k];m.acc=JSON.parse(JSON.stringify(src.acc||{}));
    m.variants=src.variants.map(v=>newVariant({color:v.color,cardColor1:v.cardColor1,card2:v.card2,cardColor2:v.cardColor2,liningColor:v.liningColor,finish:v.finish}))}
  else if(src){m.supplier=src.supplier;m.group=src.group}
  else if(F.sup){const any=S.models.find(o=>fold(o.supplier)===F.sup);if(any)m.supplier=any.supplier}
  const i=src?S.models.indexOf(src)+1:S.models.length;S.models.splice(i,0,m);
  F.miss=false;$('#fMiss').checked=false;F.q='';$('#q').value='';if(F.stat==='dropped'){F.stat='';$('#fStat').value=''}
  changed();select(m.id,{focus:m.supplier?'code':'supplier'});
  if(src&&copy)toast('Copied from previous model — type the code, fix what differs');
}
function cmdDup(){const src=M();if(!src)return;const m=JSON.parse(JSON.stringify(src));m.id=uid();m.code=src.code+' (copy)';m.photos=[];m.created=Date.now();m.variants.forEach(v=>v.id=uid());S.models.splice(S.models.indexOf(src)+1,0,m);changed();select(m.id,{focus:'code'});toast('Duplicated (without photos)')}
async function deleteModels(ids){const ms=S.models.filter(m=>ids.includes(m.id));if(!ms.length)return;
  if(!await confirmBox(ms.length===1?`Delete <b>${esc(ms[0].code||'this model')}</b> and its ${ms[0].variants.length} color(s)? This cannot be undone.<br><span class="hint">Tip: use <b>Drop</b> instead to keep it but leave it out of the export.</span>`:`Delete <b>${ms.length} models</b>? This cannot be undone.`,'Delete',true))return;
  const vis=visible();const i=vis.findIndex(x=>x.id===cur);
  for(const m of ms){for(const id of m.photos)await dropImage(id);S.models.splice(S.models.indexOf(m),1);SEL.delete(m.id)}
  if(!S.models.some(m=>m.id===cur)){const rest=vis.filter(x=>!ids.includes(x.id));cur=(rest[Math.min(Math.max(i,0),rest.length-1)]||{}).id||null}
  changed();renderMain();renderSide();toast(ms.length+' model(s) deleted')}
function cmdDel(){const m=M();if(m)deleteModels([m.id])}
function setStatus(ids,st){let n=0;for(const m of S.models)if(ids.includes(m.id)&&m.status!==st){m.status=st;n++}changed();renderMain();renderSide();toast(`${n} model(s) ${st==='dropped'?'dropped — not exported':'restored'}`)}
function addVariant(o={}){const m=M();const v=newVariant(o);if(v.color){v.cardColor1=guessCC(m,v,1);v.cardColor2=guessCC(m,v,2)}m.variants.push(v);changed();renderVars();updateThumbs();updateIssues();const fe=$(`#main [data-vid="${v.id}"][data-k="${v.color?'cardColor1':'color'}"]`);fe&&fe.focus()}
function cmdMove(ids){const w=modal(`<h3>Move ${ids.length} model(s)</h3><p class="hint">Leave a field empty to keep it as is.</p>
  <label class="f" style="margin-bottom:8px"><span>Supplier</span><input id="mvS" list="mvSL"></label><label class="f"><span>Group</span><input id="mvG" list="mvGL"></label>
  <datalist id="mvSL">${L('supplier').items.map(i=>`<option value="${esc(i.name)}">`).join('')}${[...new Set(S.models.map(m=>m.supplier).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <datalist id="mvGL">${[...new Set(S.models.map(m=>m.group).filter(Boolean))].sort(natcmp).map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <div class="foot"><button data-r="0">Cancel</button><button class="primary" data-r="1">Move</button></div>`);
  w.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;if(b.dataset.r==='1'){const s=clean($('#mvS',w).value),g=clean($('#mvG',w).value);for(const m of S.models)if(ids.includes(m.id)){if(s)m.supplier=s;if(g)m.group=g}SEL.clear();changed();renderMain();renderSide();toast('Moved')}closeModal()}}

document.addEventListener('input',e=>{

document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.k||!t.closest('#main')||t.classList.contains('chipin'))return;const m=M();if(!m)return;const k=t.dataset.k;const f=fd(k);
  const v=t.dataset.vid?m.variants.find(x=>x.id===t.dataset.vid):null;
  let val=f.t==='num'?clean(t.value).replace(',','.'):(k==='notes'?t.value.trim():clean(t.value));
  if(f.t==='list'&&val){const it=findItem(f.list,val);if(it)val=it.name;else{const e2=collect(k).get(fold(val));if(e2&&e2.n>1)val=e2.value}}
  else if(f.t==='cc'&&val){const cc=findCardColor(findCard(eff(m,v,f.of)),val);if(cc)val=cc.code;else{const e2=collect(k).get(fold(val));if(e2&&e2.n>1)val=e2.value}}
  else if(f.t==='text'&&val&&k!=='notes'&&k!=='code'){const e2=collect(k).get(fold(val));if(e2&&e2.n>1)val=e2.value}
  if(val!==t.value){t.value=val;if(v)v[k]=val;else m[k]=val;changed()}
  if(k==='card1'&&!v){const c=findCard(val);if(c&&c.material&&!clean(m.material1)){m.material1=c.material;const i=$('#main [data-k="material1"]:not([data-vid])');if(i)i.value=c.material;changed()}}
  if(k==='card2'&&!v){const c=findCard(val);if(c&&c.material&&!clean(m.material2)){m.material2=c.material;const i=$('#main [data-k="material2"]:not([data-vid])');if(i)i.value=c.material;changed()}}
  if(v&&k==='color'){let ch=false;for(const w of[1,2]){const kk='cardColor'+w;if(!clean(v[kk])){const g=guessCC(m,v,w);if(g){v[kk]=g;ch=true;const i=$(`#main [data-vid="${v.id}"][data-k="${kk}"]`);if(i)i.value=g}}}if(ch)changed()}
  updateThumbs();updateIssues();
});
$('#main').addEventListener('click',async e=>{
  const m=M();const t=e.target;
  if(t.closest('[data-goto]')){select(t.closest('[data-goto]').dataset.goto);return}
  const al=t.closest('[data-addlib]');if(al){const k=al.dataset.addlib,val=al.dataset.val;if(al.dataset.card){addCardColor(findCard(al.dataset.card),val)}else{addToList(fd(k).list||k,val)}toast(`Added "${val}" to library`);renderMain();renderSide();return}
  const fc=t.closest('[data-focus]');if(fc){const k=fc.dataset.focus;if(k==='photo'){$('#filePh').click();return}const s=fc.dataset.fvid?`[data-k="${k}"][data-vid="${fc.dataset.fvid}"]`:`[data-k="${k}"]:not([data-vid])`;const el=$('#main '+s)||$(`#main [data-k="${k}"]`);if(el){el.focus();el.scrollIntoView({block:'center'})}else if(k==='color')addVariant();return}
  const cd=t.closest('[data-chipdel]');if(cd){const id=cd.closest('[data-accf]').dataset.accf;const a=m.acc[id]||[];a.splice(+cd.dataset.chipdel,1);m.acc[id]=a;changed();refreshAcc(id);return}
  const lbi=t.closest('[data-lbitem]');if(lbi){const[l,i]=lbi.dataset.lbitem.split(':');const it=L(l).items.find(x=>x.id===i);if(it)openLB([it.img],0,[it.name+(it.tr?' — '+it.tr:'')]);return}
  if(t.matches('img[data-thumbfor]')&&t.dataset.full){openLB([t.dataset.full],0);return}
  if(t.closest('.chips')&&!t.closest('button')){const i=$('.chipin',t.closest('.chips'));i&&i.focus();return}
  const ib=t.closest('[data-ib]');if(ib&&m){const id=ib.dataset.ib;S.inbox=S.inbox.filter(x=>x!==id);m.photos.push(id);changed();renderPhotos();updateIssues();return}
  const a=t.closest('[data-act]');
  if(!a){const ph=t.closest('[data-ph]');if(ph)openLB(m.photos,m.photos.indexOf(ph.dataset.ph));return}
  const act=a.dataset.act;const tr=a.closest('tr[data-vid]');const ph=a.closest('[data-ph]');

  else if(act==='vq')addVariant({color:a.dataset.c});
  else if(act==='vdup'){const v=m.variants.find(x=>x.id===tr.dataset.vid);m.variants.splice(m.variants.indexOf(v)+1,0,{...v,id:uid()});changed();renderVars();updateThumbs();updateIssues()}
  else if(act==='vdel'){m.variants=m.variants.filter(x=>x.id!==tr.dataset.vid);changed();renderVars();updateThumbs();updateIssues()}
  else if(act==='phadd')$('#filePh').click();
  else if(act==='ibadd')$('#fileInbox').click();
  else if(act==='ibclear'){if(!await confirmBox(`Delete all ${S.inbox.length} photos in the inbox?`,'Delete',true))return;for(const id of S.inbox)await dropImage(id);S.inbox=[];changed();renderPhotos()}
  else if(act==='phmain'){const id=ph.dataset.ph;m.photos=[id,...m.photos.filter(x=>x!==id)];changed();renderPhotos();renderSide()}
  else if(act==='phinbox'){const id=ph.dataset.ph;m.photos=m.photos.filter(x=>x!==id);S.inbox.unshift(id);changed();renderPhotos();updateIssues()}
  else if(act==='phdel'){const id=ph.dataset.ph;m.photos=m.photos.filter(x=>x!==id);await dropImage(id);changed();renderPhotos();updateIssues()}
});

document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('on')){if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')lbStep(1);if(e.key==='ArrowLeft')lbStep(-1);return}
  const t=e.target;
  if(ddS&&ddS.input===t&&$('#dd').classList.contains('on')){
    if(e.key==='ArrowDown'){ddMove(1);e.preventDefault();return}
    if(e.key==='ArrowUp'){ddMove(-1);e.preventDefault();return}
    if(e.key==='Escape'){closeDD();e.preventDefault();return}
    if(e.key==='Enter'&&ddS.idx>=0){e.preventDefault();const chip=t.classList.contains('chipin');ddPick(ddS.idx);if(!chip&&!t.closest('#modal'))focusNext(t);return}
  }
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  if(e.altKey&&(e.key==='n'||e.key==='N')){e.preventDefault();cmdNew();return}
  if(e.altKey&&(e.key==='r'||e.key==='R')){e.preventDefault();if(M())addVariant();return}
  if(e.altKey&&e.key==='ArrowDown'){e.preventDefault();step(1);return}
  if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();step(-1);return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='f'||e.key==='F')){e.preventDefault();$('#q').focus();$('#q').select();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();toast('Everything is saved automatically ✓');return}
  if(t.classList.contains('chipin')){if(e.key==='Backspace'&&!t.value){const id=t.dataset.k;const a=M().acc[id]||[];if(a.length){a.pop();changed();refreshAcc(id,true)}}if(e.key==='Enter'){e.preventDefault();if(!t.value)focusNext(t)}return}
  if(e.key==='Enter'&&t.matches('#main input[data-k]')){e.preventDefault();t.dispatchEvent(new Event('change',{bubbles:true}));focusNext(t)}
});
function focusNext(t){const all=$$('#main input[data-k], #main textarea[data-k]');const i=all.indexOf(t);if(i>=0&&all[i+1]){all[i+1].focus();all[i+1].select&&all[i+1].select()}}

function ddItems(t){
  const k=t.dataset.k;const f=fd(k);const m=M();const v=t.dataset.vid?m.variants.find(x=>x.id===t.dataset.vid):null;
  if(f.t==='num'||k==='code'||k==='notes')return[];
  const typed=clean(t.value);const q=ddS&&ddS.typed?fold(typed):'';const out=[];const seen=new Set();
  const push=o=>{const key=fold(o.value);if(seen.has(key))return;seen.add(key);out.push(o)};
  const match=(...s)=>!q||fold(s.join(' ')).includes(q);
  if(f.t==='acc'){const c=f.cat;const cur=(m.acc[k]||[]).map(fold);
    if(!cur.includes(fold(NONE))&&match('none'))out.push({value:NONE,label:'— None —',none:1});
    for(const it of c.items){if(cur.includes(fold(it.name)))continue;if(!match(it.name,it.tr,it.code))continue;push({value:it.name,sub:[it.tr,it.code].filter(Boolean).join(' · '),img:it.img||'-'})}
    if(!c.strict)for(const e of collect2acc(k))if(!cur.includes(fold(e))&&match(e))push({value:e,sub:'used before'});
    if(typed&&!findItem(k,typed))out.push({value:typed,add:k,label:`+ Add “${typed}” to ${c.name}`});
    return out.slice(0,40)}
  if(f.t==='list'){const l=L(f.list);
    for(const it of l.items){if(!match(it.name,it.tr,it.code,it.supplier,it.material))continue;const sub=l.kind==='card'?[it.supplier,it.material,(it.colors||[]).length?(it.colors.length+' colors'):''].filter(Boolean).join(' · '):[it.tr,it.code].filter(Boolean).join(' · ');push({value:it.name,sub,img:l.kind==='card'||it.img?(it.img||'-'):''})}
    if(!l.strict){const hist=[...collect(k,{sup:fold(m.supplier)}).values()].sort((a,b)=>b.hit-a.hit||b.n-a.n);let first=true;for(const e of hist){if(!match(e.value)||seen.has(fold(e.value)))continue;push({value:e.value,n:e.n,sec:first?'Used before (not in list)':''});first=false}}
    if(typed&&!findItem(f.list,typed))out.push({value:typed,add:f.list,label:`+ Add “${typed}” to ${l.name}`});
    return out.slice(0,40)}
  if(f.t==='cc'){const card=findCard(eff(m,v,f.of));
    if(card)for(const c of card.colors||[])if(match(c.code))push({value:c.code,img:c.img||'-',sub:card.name});
    if(!(card&&L('card').strict&&(card.colors||[]).length)){const hist=[...collect(k,{card:fold(eff(m,v,f.of))}).values()].sort((a,b)=>b.hit-a.hit||b.n-a.n);for(const e of hist)if(match(e.value))push({value:e.value,n:e.n,star:e.hit?'This card':''})}
    if(typed&&card&&!findCardColor(card,typed))out.push({value:typed,addcc:card.id,label:`+ Add “${typed}” to ${card.name} colors`});
    return out.slice(0,40)}
  const hist=[...collect(k,{sup:fold(m.supplier)}).values()].sort((a,b)=>b.hit-a.hit||b.n-a.n);for(const e of hist)if(match(e.value))push({value:e.value,n:e.n});
  if(q&&out.length===1&&fold(out[0].value)===q)return[];return out.slice(0,20)}
function collect2acc(k){const s=new Map();for(const m of S.models)for(const v of m.acc[k]||[])if(v!==NONE&&!findItem(k,v))s.set(fold(v),v);return[...s.values()]}
function openDD(t){ddS={input:t,idx:-1,items:[],typed:false};refreshDD()}
function refreshDD(){if(!ddS)return;ddS.items=ddItems(ddS.input);ddS.idx=-1;const dd=$('#dd');
  if(!ddS.items.length){dd.classList.remove('on');return}
  dd.innerHTML=ddS.items.map((o,i)=>`${o.sec?`<div class="sec">${esc(o.sec)}</div>`:''}<div class="o ${o.add||o.addcc?'add':''} ${o.none?'none':''}" data-i="${i}">${o.img?(o.img==='-'?'<span class="ni"></span>':`<img data-img="${o.img}" alt="">`):''}<div class="v"><div>${esc(o.label||o.value)}</div>${o.sub?`<div class="s">${esc(o.sub)}</div>`:''}</div>${o.star?`<span class="star">${esc(o.star)}</span>`:''}${o.n?`<span class="c">${o.n}</span>`:''}</div>`).join('');
  dd.classList.add('on');posDD();hydrate(dd);
  if(!ddS.input.classList.contains('chipin')){const cv=fold(ddS.input.value);const ci=ddS.items.findIndex(o=>!o.add&&!o.addcc&&fold(o.value)===cv);if(ci>=0){ddS.idx=ci-1;ddMove(1)}}
  else if(ddS.typed){const ci=ddS.items.findIndex(o=>!o.none);if(ci>=0){ddS.idx=ci-1;ddMove(1)}}}
function posDD(){if(!ddS)return;const r=ddS.input.getBoundingClientRect();const dd=$('#dd');dd.style.left=Math.min(r.left,window.innerWidth-320)+'px';dd.style.minWidth=Math.max(240,r.width)+'px';const below=window.innerHeight-r.bottom;if(below<220&&r.top>below){dd.style.top='';dd.style.bottom=(window.innerHeight-r.top+2)+'px';dd.style.maxHeight=Math.min(340,r.top-10)+'px'}else{dd.style.bottom='';dd.style.top=(r.bottom+2)+'px';dd.style.maxHeight=Math.min(340,below-10)+'px'}}
function ddMove(d){if(!ddS.items.length)return;ddS.idx=(ddS.idx+d+ddS.items.length)%ddS.items.length;$$('#dd .o').forEach((o,i)=>o.classList.toggle('on',i===ddS.idx));$$('#dd .o')[ddS.idx]?.scrollIntoView({block:'nearest'})}
function ddPick(i){const o=ddS.items[i];if(!o)return;const t=ddS.input;const m=M();

  if(t.classList.contains('chipin')){const id=t.dataset.k;const a=m.acc[id]||[];let val=o.value;if(val===NONE){m.acc[id]=[NONE]}else{const it=findItem(id,val);if(it)val=it.name;m.acc[id]=a.filter(x=>x!==NONE&&fold(x)!==fold(val)).concat(val)}changed();closeDD();refreshAcc(id,true);return}

$('#dd').addEventListener('mousedown',e=>{const o=e.target.closest('.o');if(!o||!ddS)return;e.preventDefault();const t=ddS.input;const chip=t.classList.contains('chipin');ddPick(+o.dataset.i);if(!chip)focusNext(t)});

async function readXlsx(buf){

  const rels=async p=>{const dir=p.split('/');const fn=dir.pop();const r=await xml([...dir,'_rels',fn+'.rels'].join('/'));const m={};if(r)for(const e of T(r,'Relationship'))m[e.getAttribute('Id')]={t:resolve(p,e.getAttribute('Target')),type:e.getAttribute('Type')};return m};

    const rid=sh.getAttributeNS(NS_R,'id')||sh.getAttribute('r:id');const path=wbr[rid]?.t;if(!path)continue;const doc=await xml(path);if(!doc)continue;

        const t=c.getAttribute('t');const vEl=T(c,'v')[0];let v='';
        if(t==='s')v=ss[+vEl?.textContent]??'';else if(t==='inlineStr')v=T(c,'t').map(x=>x.textContent).join('');else if(t==='b')v=vEl?.textContent==='1'?'TRUE':'FALSE';else if(vEl){v=vEl.textContent;if(!t||t==='n'){const n=+v;if(isFinite(n))v=String(Math.round(n*1e6)/1e6)}}

      for(const an of[...T(d,'twoCellAnchor'),...T(d,'oneCellAnchor')]){const from=T(an,'from')[0];if(!from)continue;const row=+T(from,'row')[0].textContent,col=+T(from,'col')[0].textContent;

function unifyCase(){let n=0;for(const f of BASE){if(f.t==='num'||f.k==='code'||f.k==='notes')continue;const c=collect(f.k);

  for(const m of S.models){if(f.lv!=='v')m[f.k]=fix(m[f.k]);if(f.lv!=='m')for(const v of m.variants)v[f.k]=fix(v[f.k])}}

async function imgForExcel(id,max,boxW,boxH){const r=await DB.get('img',id);if(!r)return null;const bmp=await decode(r.full);if(!bmp)return null;const j=await scaleTo(bmp,max,.82);bmp.close&&bmp.close();const s=Math.min(boxW/j.w,boxH/j.h);return{data:new Uint8Array(await j.blob.arrayBuffer()),ext:'jpeg',w:Math.round(j.w*s),h:Math.round(j.h*s)}}
async function exportXlsx(models,o){

    const ms=o.miss?issues(m).miss:[];const isMiss=(k,vid)=>ms.some(x=>x.k===k&&(x.vid?x.vid===vid:true));

      for(const f of FL){let val=f.t==='acc'?accText(m.acc[f.k]):eff(m,v,f.k);if(f.k==='notes')val=[m.notes,v&&v.notes].map(clean).filter(Boolean).join(' / ');if(f.t==='num'&&val!==''&&isFinite(+val))val=+val;cells.push({v:val,s:isMiss(f.k,v&&v.id)?base+1:base})}

  for(let i=0;i<images.length;i++){busy(true,`Adding photos ${i+1}/${images.length}…`);const im=await imgForExcel(images[i].pending,o.sz,176,PH-4);if(im)Object.assign(images[i],im,{col:1});else images[i].skip=1}
  const sheets=[{name:'Samples',widths,rows,images:images.filter(i=>!i.skip),freeze:1,filter:1}];

    for(const c of catList()){const used=new Map();for(const m of models)for(const v of m.acc[c.id]||[]){if(v===NONE)continue;const k=fold(v);if(!used.has(k))used.set(k,{v,codes:[]});const u=used.get(k);if(!u.codes.includes(m.code))u.codes.push(m.code)}

        if(it&&it.img){const im=await imgForExcel(it.img,300,74,74);if(im)ai.push({...im,row:ar.length-1,col:1})}}}
    if(ar.length>1)sheets.push({name:'Accessories',widths:[18,12,32,26,16,40],rows:ar,images:ai,freeze:1})}
  if(o.card){const cr=[{ht:24,cells:[{v:'Color Card',s:1},{v:'Card Photo',s:1},{v:'Supplier',s:1},{v:'Material',s:1},{v:'Color Code',s:1},{v:'Swatch',s:1},{v:'Used in models',s:1}]}];const ci=[];

function migrate(s){

  if(s.v===2){const d=defaultLists();s.lists=s.lists||d.lists;s.catOrder=s.catOrder||d.catOrder;for(const id of Object.keys(d.lists))if(!s.lists[id]&&d.lists[id].kind!=='acc')s.lists[id]=d.lists[id];s.settings=s.settings||{};s.settings.req={...DEFAULT_REQ,...(s.settings.req||{})};if(s.settings.copyPrev==null)s.settings.copyPrev=true;s.inbox=s.inbox||[];for(const m of s.models){m.acc=m.acc||{};m.status=m.status||'active'}return s}
  const n=blankState();n.project=s.project==='SS27 Numune'?'SS27 Samples':(s.project||n.project);n.inbox=s.inbox||[];n.lastBackup=s.lastBackup||0;n.changedSinceBackup=true;
  const mk={kod:'code',anaMalzeme:'mainMaterial',malzeme1:'material1',kartela1:'card1',malzeme2:'material2',kartela2:'card2',astarMalzeme:'liningMaterial',astarRengi:'liningColor',logoBuckle:'finish',notlar:'notes',h:'height',w:'width',d:'depth',supplier:'supplier',group:'group',modelType:'modelType'};
  const vk={color:'color',krk1:'cardColor1',kartela2:'card2',krk2:'cardColor2',astarRengi:'liningColor',logoBuckle:'finish',notlar:'notes'};
  const accv=v=>{v=clean(v);if(!v)return[];if(/^(yok|no ?charm|none)$/i.test(v))return[NONE];return[v]};
  S=n;
  for(const o of s.models||[]){const m=newModel();m.id=o.id;m.created=o.created||Date.now();m.photos=o.photos||[];for(const[a,b]of Object.entries(mk))m[b]=o[a]||'';
    const acc={acc_logo:accv(o.logo),acc_charm:accv(o.charm),acc_other:accv(o.ekBilesen)};for(const[k,v]of Object.entries(acc))if(v.length)m.acc[k]=v;
    m.variants=(o.variants||[]).map(ov=>{const v=newVariant({id:ov.id});for(const[a,b]of Object.entries(vk))v[b]=ov[a]||'';return v});n.models.push(m)}
  for(const a of s.acc||[]){const cat=guessCat((a.en||'')+' '+(a.tr||''));const name=clean(a.en)||clean(a.tr);if(!name)continue;n.lists[cat].items.push(mkItem(name,{tr:clean(a.tr),img:a.img||''}))}
  const req=s.settings&&s.settings.req||{};const rk={kod:'code',anaMalzeme:'mainMaterial',kartela1:'card1',krk1:'cardColor1',logoBuckle:'finish',h:'height',w:'width',d:'depth'};
  for(const[k,v]of Object.entries(req)){const nk=rk[k]||k;if(nk in DEFAULT_REQ)n.settings.req[nk]=v}
  if(s.settings&&s.settings.copyPrev!=null)n.settings.copyPrev=s.settings.copyPrev;
  for(const id of Object.keys(n.lists)){const l=n.lists[id];for(const v of unlisted(id)){const it=mkItem(v);if(l.kind==='card')it.colors=[];l.items.push(it)}}
  seedCardColors();unifyCase();
  return n}

  $('#projName').value=S.project;cur=S.models[0]?.id||null;
  renderSide();renderMain();updateBackupPill();setInterval(updateBackupPill,60000);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(raw&&raw.v!==2)toast('Your data was upgraded to the new version ✓');
})();
</script>
